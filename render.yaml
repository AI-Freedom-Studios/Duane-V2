databases:
  - name: agentos-db
    plan: starter
    databaseName: agentos
    user: agentos
    ipAllowList: []

services:
  # Redis
  - type: redis
    name: agentos-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # NestJS API
  - type: web
    name: agentos-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: agentos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agentos-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          name: agentos-web
          type: web
          property: host
    healthCheckPath: /health
    buildCommand: ""
    startCommand: ""

  # Next.js Frontend
  - type: web
    name: agentos-web
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: agentos-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /
    buildCommand: ""
    startCommand: ""
